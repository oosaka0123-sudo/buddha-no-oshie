<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仏陀とは｜仏陀の教え</title><meta name="description" content="ゴータマ・シッダールタの人物像を、伝承と歴史研究を分けながらたどります。"><meta name="theme-color" content="#171510"><link rel="canonical" href="https://oosaka0123-sudo.github.io/buddha-no-oshie/buddha.html"><link rel="stylesheet" href="assets/site.css"><script defer src="assets/site.js"></script></head><body data-kicker="BUDDHA" data-title="神ではなく、問い続けた一人の人間。" data-lead="ゴータマ・シッダールタの人物像を、伝承と歴史研究を分けながらたどります。" data-chapters="伝承と歴史|仏伝には象徴的な物語も含まれる。史実と信仰上の伝承を区別する。||人間としての仏陀|苦・老い・病・死に向き合った人物として、その出発点を見る。||最初の問い|何を信じるかより、苦しみがどう生まれるかを観察する。"><main id="fallback"><h1>神ではなく、問い続けた一人の人間。</h1><p>ゴータマ・シッダールタの人物像を、伝承と歴史研究を分けながらたどります。</p></main></body></html>
